# Larger-motion teaching demonstration; benchmark profile remains cartesian_lqr.yaml.
# Completion is required for TVLQR; comparison-controller guard stops stay visible.
schema_version: 2
base_config: config/left_arm.yaml
control_period_s: 0.01
initial_position_deg:
- 0
- -30
- 15
- 45
- 0
- 20
- 0
trajectory:
  start_hold_s: 1.0
  move_s: 5.0
  end_hold_s: 2.0
  displacement_world_m:
  - 0.24
  - 0.16
  - 0.08
  ik_tolerance: 1.0e-10
  max_ik_iterations: 40
weights:
  ee_position_scale_m: 0.005
  ee_orientation_scale_rad: 0.05
  joint_position_scale_rad: 0.15
  joint_velocity_scale_rad_s: 0.6
  torque_scale_nm:
  - 4
  - 4
  - 2
  - 2
  - 0.8
  - 0.8
  - 0.8
  effort_weight: 1.0
pd:
  natural_frequency_rad_s: 12.0
  damping_ratio: 1.0
pd_frequency_sweep_rad_s:
- 8
- 12
- 20
- 30
- 40
- 60
- 80
strong_pd_frequency_rad_s: 80
disturbance:
  start_s: 3.0
  duration_s: 1.5
  force_world_n:
  - 0.0
  - 5.0
  - 0.0
scenarios:
  nominal:
    force_multiplier: 0.0
    delay_steps: 0
    time_constant_s: 0.0
  push:
    force_multiplier: 1.0
    delay_steps: 0
    time_constant_s: 0.0
  reverse_push:
    force_multiplier: -1.0
    delay_steps: 0
    time_constant_s: 0.0
  delayed_nominal:
    force_multiplier: 0.0
    delay_steps: 2
    time_constant_s: 0.005
  delayed_push:
    force_multiplier: 1.0
    delay_steps: 2
    time_constant_s: 0.005
  stress_push:
    force_multiplier: 4.0
    delay_steps: 0
    time_constant_s: 0.0
acceptance:
  reference_position_m: 1.0e-06
  reference_orientation_rad: 1.0e-06
  nominal_peak_position_m: 0.002
  pushed_peak_position_m: 0.06
  final_position_m: 0.001
  recovery_band_m: 0.001
  riccati_relative_residual: 1.0e-09
  linearization_relative_error: 0.0001
required_completion_controllers:
- tvlqr
presentation:
  playback_speed: 0.5
  camera_azimuth_deg: -60.0
  camera_elevation_deg: -15.0
  camera_distance_m: 1.25
  camera_lookat_world_m:
  - 0.21
  - -0.04
  - 0.67
  force_arrow_m_per_n: 0.045
