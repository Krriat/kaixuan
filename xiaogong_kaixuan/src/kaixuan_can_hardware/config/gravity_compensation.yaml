# B in N.m / (rad/s), gravity_vector in the URDF root/world frame, m/s^2.
# gravity_scale=1 applies the full model torque; the controller adds no position spring.
# 2026-11-04: left_joint6 URDF axis is +Z. Pinocchio reloads this axis from robot_description;
# hardware direction stays +1, and damping remains positive in the corrected joint coordinates.
gravity_vector: [0.0, 0.0, -9.80665]
zero_hold_duration: 0.5
# Optional assistance along measured joint velocity. Zero at rest; bounded above
# the identified speed range. This gain is an initial trial value, not identified.
friction_compensation:
  enabled: true
  parameter_file: left_arm_friction_identified.yaml
  scale: 0.25
  velocity_deadband_deg_s: 0.2
  velocity_full_deg_s: 0.5
  filter_time_constant_s: 0.02
  effort_limits_nm:
    left_joint1: 4.3
    left_joint2: 2.4
    left_joint3: 2.4
    left_joint4: 2.9
    left_joint5: 0.13
    left_joint6: 0.13
    left_joint7: 0.13
  slew_nm_s:
    left_joint1: 2.0
    left_joint2: 1.2
    left_joint3: 1.2
    left_joint4: 1.4
    left_joint5: 0.08
    left_joint6: 0.08
    left_joint7: 0.08
damping:
  left_joint1: 2.0
  left_joint2: 2.0
  left_joint3: 1.0
  left_joint4: 0.8
  left_joint5: 0.2
  left_joint6: 0.2
  left_joint7: 0.1
  right_joint1: 2.0
  right_joint2: 2.0
  right_joint3: 1.0
  right_joint4: 0.8
  right_joint5: 0.2
  right_joint6: 0.2
  right_joint7: 0.1
